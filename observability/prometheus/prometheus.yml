global:
  scrape_interval: 15s
scrape_configs:
  - job_name: hacuba-auth
    static_configs:
      - targets: ["host.docker.internal:8080"]
  - job_name: hacuba-listings
    static_configs:
      - targets: ["host.docker.internal:8081"]
  - job_name: hacuba-support
    static_configs:
      - targets: ["host.docker.internal:8082"]
