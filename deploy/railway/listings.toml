[build]
builder = "DOCKERFILE"
dockerfilePath = "services/listings/Dockerfile"
watchPatterns = ["services/listings/**", "shared/authjwt/**"]

[deploy]
preDeployCommand = ["/migrate -dir /migrations"]
healthcheckPath = "/readyz"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
