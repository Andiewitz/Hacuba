name: listings-tests

on:
  push:
    paths: ["services/listings/**", "shared/authjwt/**", ".github/workflows/listings-tests.yml"]
  pull_request:
    paths: ["services/listings/**", "shared/authjwt/**"]

jobs:
  unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/listings
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: services/listings/go.sum
      - run: go vet ./...
      - run: go test -race -count=1 ./...

  postgres:
    name: integration (real postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: listings
          POSTGRES_USER: listings_service
          POSTGRES_PASSWORD: testpw
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U listings_service -d listings"
          --health-interval 5s --health-timeout 3s --health-retries 10
    defaults:
      run:
        working-directory: services/listings
    env:
      TEST_DATABASE_URL: postgres://listings_service:testpw@localhost:5432/listings?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: services/listings/go.sum
      - run: go vet ./...
      - run: go test -race -count=1 ./...

  smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/listings
    steps:
      - uses: actions/checkout@v4
      - name: bring up private stack
        env:
          DB_PASSWORD: smoke-test-pw
          JWT_SECRET: smoke-test-secret-must-be-32-bytes-minimum!!
          PORT: "8081"
        run: |
          printf 'DB_PASSWORD=smoke-test-pw\nJWT_SECRET=smoke-test-secret-must-be-32-bytes-minimum!!\nPORT=8081\n' > .env
          docker compose up -d --build
          for i in $(seq 1 30); do curl -sf http://localhost:8081/healthz && break; sleep 2; done
          curl -sf http://localhost:8081/healthz
      - run: ./tests/compose.smoke.sh http://localhost:8081
      - if: failure()
        run: docker compose logs --no-color | tail -100
      - if: always()
        run: docker compose down -v
