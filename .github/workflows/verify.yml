name: verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  client:
    name: client quality and production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run typecheck --workspace client
      - run: npm run lint --workspace client
      - run: npm run build --workspace client
      - run: npm audit --omit=dev --audit-level=high

  auth:
    uses: ./.github/workflows/auth-tests.yml

  listings:
    uses: ./.github/workflows/listings-tests.yml

  support:
    uses: ./.github/workflows/support-tests.yml

  terraform:
    uses: ./.github/workflows/terraform-validate.yml

  browser:
    uses: ./.github/workflows/e2e.yml
