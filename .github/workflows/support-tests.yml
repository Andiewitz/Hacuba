name: support-tests

on:
  push:
    paths: ["services/support/**", "shared/authjwt/**", ".github/workflows/support-tests.yml"]
  pull_request:
    paths: ["services/support/**", "shared/authjwt/**"]

jobs:
  unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/support
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: services/support/go.sum
      - run: go vet ./...
      - run: go test -race -count=1 ./...
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: support
          POSTGRES_USER: support_service
          POSTGRES_PASSWORD: testpw
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U support_service -d support"
          --health-interval 5s --health-timeout 3s --health-retries 10
    defaults:
      run:
        working-directory: services/support
    env:
      TEST_DATABASE_URL: postgres://support_service:testpw@localhost:5432/support?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: services/support/go.sum
      - run: go vet ./...
      - run: go test -race -count=1 ./...
  smoke:
    name: compose smoke (live HTTP)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/support
    steps:
      - uses: actions/checkout@v4
      - name: bring up isolated stack
        env:
          DB_PASSWORD: smoke-test-pw
          JWT_SECRET: smoke-test-secret-must-be-32-bytes-minimum!!
          SUPPORT_PROXY_SECRET: smoke-proxy-secret
          PORT: "8082"
        run: |
          printf 'DB_PASSWORD=smoke-test-pw\nJWT_SECRET=smoke-test-secret-must-be-32-bytes-minimum!!\nSUPPORT_PROXY_SECRET=smoke-proxy-secret\nPORT=8082\n' > .env
          docker compose up -d --build
          for i in $(seq 1 30); do
            curl -sf http://localhost:8082/healthz && break
            sleep 2
          done
          curl -sf http://localhost:8082/healthz
      - name: run smoke contract
        run: ./tests/compose.smoke.sh http://localhost:8082
      - name: dump logs on failure
        if: failure()
        run: docker compose logs --no-color | tail -100
      - name: tear down
        if: always()
        run: docker compose down -v
