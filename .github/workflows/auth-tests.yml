name: auth-tests

on:
  push:
    paths:
      - "services/auth/**"
      - ".github/workflows/auth-tests.yml"
  pull_request:
    paths:
      - "services/auth/**"

jobs:
  unit:
    name: unit (memory store)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/auth
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: services/auth/go.sum
      - run: go vet ./...
      - run: go test -race -count=1 ./...

  postgres:
    name: integration (real postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: auth
          POSTGRES_USER: auth_service
          POSTGRES_PASSWORD: testpw
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U auth_service -d auth"
          --health-interval 5s --health-timeout 3s --health-retries 10
    defaults:
      run:
        working-directory: services/auth
    env:
      TEST_DATABASE_URL: postgres://auth_service:testpw@localhost:5432/auth?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: services/auth/go.sum
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - name: coverage gate
        run: |
          go test -count=1 -coverprofile=cover.out ./...
          go tool cover -func=cover.out | tee cover.txt
          TOTAL=$(go tool cover -func=cover.out | awk '/^total:/ {gsub(/%/,"",$3); print $3}')
          echo "total coverage: $TOTAL%"
          python3 -c "import sys; sys.exit(0 if float('$TOTAL') >= 60 else 1)" \
            || (echo "coverage $TOTAL% below 60% gate" && exit 1)

  smoke:
    name: compose smoke (live HTTP)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/auth
    steps:
      - uses: actions/checkout@v4
      - name: validate compose DSN
        env:
          DB_PASSWORD: smoke-test-pw
          JWT_SECRET: smoke-test-secret-must-be-32-bytes-minimum!!
          COOKIE_SECURE: "false"
          PORT: "8080"
        run: |
          DSN=$(docker compose config | awk '/DATABASE_URL:/ {print $2}')
          python3 - "$DSN" <<'EOF'
          import sys, urllib.parse
          u = urllib.parse.urlparse(sys.argv[1])
          assert u.hostname == "auth-db", u.hostname
          assert u.port == 5432, u.port
          assert u.username == "auth_service", u.username
          print("DSN ok:", u.hostname, u.port, u.username)
          EOF
      - name: bring up isolated stack
        env:
          DB_PASSWORD: smoke-test-pw
          JWT_SECRET: smoke-test-secret-must-be-32-bytes-minimum!!
          COOKIE_SECURE: "false"
          PORT: "8080"
        run: |
          printf 'DB_PASSWORD=smoke-test-pw\nJWT_SECRET=smoke-test-secret-must-be-32-bytes-minimum!!\nCOOKIE_SECURE=false\nPORT=8080\n' > .env
          docker compose up -d --build
          for i in $(seq 1 30); do
            curl -sf http://localhost:8080/healthz && break
            sleep 2
          done
          curl -sf http://localhost:8080/healthz
      - name: run smoke contract
        run: ./tests/compose.smoke.sh http://localhost:8080
      - name: dump logs on failure
        if: failure()
        run: docker compose logs --no-color | tail -100
      - name: tear down
        if: always()
        run: docker compose down -v
