services:
  support:
    build:
      context: ../..
      dockerfile: services/support/Dockerfile
    env_file: [.env]
    environment:
      DATABASE_URL: postgres://support_service:${DB_PASSWORD:?set DB_PASSWORD}@support-db:5432/support?sslmode=disable
    depends_on:
      support-db:
        condition: service_healthy
    networks: [support-internal, default]
    ports: ["${PORT:-8082}:8082"]
  support-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: support
      POSTGRES_USER: support_service
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
    volumes:
      - support-db-data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    networks: [support-internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U support_service -d support"]
      interval: 5s
      timeout: 3s
      retries: 10
networks:
  support-internal:
    driver: bridge
    internal: true
volumes:
  support-db-data:
